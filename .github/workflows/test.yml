name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kinic:
    name: Kinic adapter (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # test_upstream_contract compares against the pinned upstream commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Kinic unit tests (fake CLI transport, no network)
        run: python -m unittest discover -s tests/kinic -v
      - name: Session start hook
        run: bash tests/hooks/test-session-start.sh
      - name: Shell lint script
        run: bash tests/shell-lint/test-lint-shell.sh

  brainstorm-branding:
    name: Visual companion branding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Telemetry stays opt-in
        run: node tests/brainstorm-server/branding.test.js
